    <radialGradient id="right-cavity" cx="50%" cy="37%" r="76%"><stop stop-color="#bdd3d0"/><stop offset="1" stop-color="#789eaa"/></radialGradient>
    <radialGradient id="left-cavity" cx="48%" cy="35%" r="72%"><stop stop-color="#e6b5a3"/><stop offset="1" stop-color="#bd7a79"/></radialGradient>
  </defs>
