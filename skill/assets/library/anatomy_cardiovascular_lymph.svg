<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 400 320">
  <title id="title">四腔心脏示意</title>
  <desc id="desc">成人心脏前面观切开示意。四心腔与房室瓣、连续心肌和室间隔、大血管分组。右心位于图左；左室壁较厚并构成心尖。淡蓝与淡红仅区分血路，肺静脉及后方血管按可见投影简化。</desc>
