<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 400 320">
  <title id="title">环节蠕虫</title>
  <desc id="desc">蚯蚓式通用环节蠕虫，保留连续柔软体躯、逐渐变细的两端、随体表弯曲的节沟与前段环带。体节数量为展示简化，未指定物种。</desc>
